name: Bug report
description: Report a reproducible problem with the CLI, API, or GitHub Action.
title: 'bug: '
body:
  - type: markdown
    attributes:
      value: Please use a minimal, anonymized example. Remove private data and credentials from all output.
  - type: input
    id: version
    attributes:
      label: changelog-guard version
      description: Output of node bin/changelog-guard.js --version (or the Action ref).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, operating system, and Git version for check-pr.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the exact command and a minimal changelog that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized stdout, stderr, and the exit code.
    validations:
      required: true
